[project]
name = "orvexadb-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.143.1",
  "psycopg[binary]==3.3.6",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.53.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
